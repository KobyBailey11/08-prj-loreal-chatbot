<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oreal Beauty Advisor</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / Branding ------->
      <header class="site-header">
        <img src="img/loreal-logo.png" alt="L'Oreal logo" class="brand-logo" />
        <p class="eyebrow">Beauty Tech Experience</p>
        <h1 class="site-title">L'Oreal Beauty Advisor</h1>
        <p class="site-subtitle">
          Ask about products, routines, and recommendations tailored to your
          goals.
        </p>
      </header>

      <!------- Chat Area ------->
      <main>
        <section class="chatbox">
          <div
            id="latestQuestion"
            class="latest-question"
            aria-live="polite"
          ></div>

          <div id="chatWindow" class="chat-window">
            <!-- messages will be appended here via JS -->
          </div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask me about products or routines…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2026 L'Oreal. All rights reserved.</p>
        <nav>
          <a
            href="https://www.loreal.com/en/privacy-policy/"
            target="_blank"
            rel="noreferrer"
            >Privacy Policy</a
          >
          <a
            href="https://www.loreal.com/en/terms-of-use/"
            target="_blank"
            rel="noreferrer"
            >Terms of Use</a
          >
          <a
            href="https://www.loreal.com/en/contact-us/"
            target="_blank"
            rel="noreferrer"
            >Contact</a
          >
        </nav>
      </footer>
    </div>

    <!-- secrets.js can be removed when using Cloudflare Workers for API requests -->
    <script src="secrets.js"></script>
    <script src="script.js"></script>
  </body>
</html>
